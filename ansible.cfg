; Makes tests/test.yml resolve `guiand888.<role_name>` against this checkout
; without relying on the repo directory name matching the role name (it
; can't — this dir is `ansible-role-<name>`, chosen specifically so a future
; `ansible-galaxy install` of the published role can never clobber this
; working tree). tests/roles/guiand888.<role_name> is a relative symlink to
; the repo root (../..), created once per role; roles_path finds it there.
; ansible-lint's role-name[path] rule (production profile) flags a role
; referenced by a raw path in `roles:` — this symlink avoids that rule
; entirely rather than suppressing it.
[defaults]
roles_path = tests/roles
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = False
nocows = True

[privilege_escalation]
become = False
become_method = sudo
